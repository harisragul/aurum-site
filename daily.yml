name: daily-update
on:
  schedule:
    - cron: "0 5,11 * * *"   # 10:30 and 16:30 IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python update.py
        env:
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
          PREMIUM: ${{ secrets.PREMIUM }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "rate-bot"
          git config user.email "rate-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "daily rate update" && git push)
